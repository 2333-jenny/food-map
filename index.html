<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="工作能量补充 · 美食地图攻略" />
  <title>能量补给站 · 美食地图</title>

  <!-- Leaflet (OpenStreetMap, 免费无 Key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- lz-string：分享链接压缩 -->
  <script src="lz-string.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 12H3a8 8 0 0 1 14-6.5"/><path d="M21 11v8a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-4"/> <circle cx="17" cy="17" r="1.5"/><path d="M13 4a5 5 0 0 1 5 5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>能量补给站</h1>
          <span class="brand-sub">工作能量 · 美食地图攻略</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="btn-import" title="导入数据">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span>导入</span>
        </button>
        <button class="btn btn-ghost" id="btn-export" title="导出数据">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg>
          <span>导出</span>
        </button>
        <button class="btn btn-primary" id="btn-share" title="分享给他人查看">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span>分享</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== 筛选工具栏 ===== -->
  <nav class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="search-input" placeholder="搜索店铺 / 地点 / 推荐菜..." autocomplete="off" />
      </div>
      <div class="filter-group" id="filter-group">
        <div class="filters-row" id="city-chips"></div>
        <div class="filters-row" id="cat-chips"></div>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="view-map" title="地图视图" aria-label="地图视图">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.5-2.2V4.8L9 7z"/><path d="M15 4l5.5 2.2v13L15 17z"/><path d="M9 20V7"/><path d="M15 17V4"/></svg>
        </button>
        <button class="view-btn" id="view-grid" title="网格视图" aria-label="网格视图">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== 主内容 ===== -->
  <main class="app-main">
    <!-- 地图视图 -->
    <section id="map-view" class="view-panel active">
      <div id="map" class="map-container"></div>
      <div class="map-legend" id="map-legend"></div>
    </section>

    <!-- 网格视图 -->
    <section id="grid-view" class="view-panel">
      <div class="grid-container" id="food-grid"></div>
      <div class="empty-state" id="grid-empty" hidden>
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#d9c9bd" stroke-width="1.5"><path d="M4 10a8 8 0 0 1 16 0"/><path d="M4 10c0 5 2 8 2 8h12s2-3 2-8"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></svg>
        </div>
        <p>还没有符合条件的记录</p>
        <button class="btn btn-primary" id="btn-empty-add">+ 添加美食</button>
      </div>
    </section>
  </main>

  <!-- ===== 悬浮添加按钮 ===== -->
  <button class="fab" id="btn-add" title="添加美食" aria-label="添加美食">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- ===== 底部 ===== -->
  <footer class="app-footer">
    <span class="foot-item">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 21s-7-5.1-7-11a7 7 0 0 1 14 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="stat-count">0 家美食</span>
    </span>
    <span class="footer-sep">·</span>
    <span class="foot-item" id="stat-city"></span>
    <span class="footer-sep">·</span>
    <span class="foot-item">数据存于本地浏览器</span>
    <span class="footer-spacer"></span>
    <a href="#" id="btn-manage" class="link">数据管理</a>
  </footer>

  <!-- ============ 弹窗：新增/编辑美食 ============ -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">添加美食</h2>
        <button class="modal-close" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="food-form" class="modal-body">
        <input type="hidden" id="field-id" />
        <div class="form-grid">
          <label class="field full">
            <span>店铺名称 <em>*</em></span>
            <input type="text" id="field-shop" required maxlength="60" placeholder="如：雄威牛肉火锅" />
          </label>

          <label class="field">
            <span>城市</span>
            <input type="text" id="field-city" maxlength="20" placeholder="如：深圳" list="city-list" />
            <datalist id="city-list"></datalist>
          </label>
          <label class="field">
            <span>区</span>
            <input type="text" id="field-district" maxlength="30" placeholder="如：坪山" />
          </label>

          <label class="field full">
            <span>地点 / 位置描述</span>
            <input type="text" id="field-place" maxlength="120" placeholder="如：龙田街道龙兴北路 / 商场名" />
          </label>

          <label class="field">
            <span>营业形态</span>
            <select id="field-type">
              <option value="实体店">实体店</option>
              <option value="小地摊">小地摊</option>
              <option value="">其他</option>
            </select>
          </label>
          <label class="field">
            <span>几人食</span>
            <select id="field-party">
              <option value="单人多人都可">单人多人都可</option>
              <option value="单人">单人</option>
              <option value="多人">多人</option>
            </select>
          </label>

          <label class="field">
            <span>餐饮类别</span>
            <select id="field-cat">
              <option value="">选择类别...</option>
            </select>
          </label>
          <label class="field">
            <span>评分 (1-5)</span>
            <div class="star-input" id="star-input">
              <span class="star" data-val="1">★</span>
              <span class="star" data-val="2">★</span>
              <span class="star" data-val="3">★</span>
              <span class="star" data-val="4">★</span>
              <span class="star" data-val="5">★</span>
              <input type="hidden" id="field-rating" value="0" />
            </div>
          </label>

          <label class="field full">
            <span>结论 / 推荐等级</span>
            <div class="verdict-select" id="verdict-select">
              <label class="verdict-opt" data-v="人上人">
                <span class="v-emo">👑</span>
                <span class="v-name">人上人</span>
                <span class="v-desc">强推</span>
              </label>
              <label class="verdict-opt" data-v="夯">
                <span class="v-emo">👍</span>
                <span class="v-name">夯</span>
                <span class="v-desc">可冲</span>
              </label>
              <label class="verdict-opt" data-v="NPC">
                <span class="v-emo">🤷</span>
                <span class="v-name">NPC</span>
                <span class="v-desc">一般</span>
              </label>
              <input type="hidden" id="field-verdict" value="" />
            </div>
          </label>

          <label class="field full">
            <span>推荐菜</span>
            <textarea id="field-dish" rows="2" maxlength="200" placeholder="招牌菜、必点..."></textarea>
          </label>
          <label class="field full">
            <span>吐槽 / 注意事项</span>
            <textarea id="field-tucao" rows="2" maxlength="300" placeholder="排队久、量少、环境差等..."></textarea>
          </label>

          <label class="field full">
            <span>图片 URL (选填)</span>
            <input type="text" id="field-image" maxlength="300" placeholder="https://..." />
          </label>

          <label class="field full">
            <span>地图定位</span>
            <div class="geo-row">
              <input type="text" id="field-geo" placeholder="点击 📍 选点，或输入 纬度,经度" />
              <button type="button" class="btn btn-secondary" id="btn-pick-geo">📍 选点</button>
              <button type="button" class="btn btn-ghost-plain" id="btn-clear-geo" title="清除定位">✕</button>
            </div>
          </label>
        </div>
        <div class="modal-footer modal-footer-sticky">
          <button type="button" class="btn btn-ghost-plain" id="btn-form-cancel">取消</button>
          <button type="submit" class="btn btn-primary-solid">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 弹窗：选点 ============ -->
  <div class="modal-backdrop" id="geo-backdrop" hidden>
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2>在地图上选择位置</h2>
        <button class="modal-close" id="geo-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="geo-search">
          <input type="text" id="geo-search-input" placeholder="🔍 搜索地址定位..." />
          <button type="button" class="btn btn-secondary" id="geo-search-btn">搜索</button>
        </div>
        <div id="geo-picker-map" class="geo-picker-map"></div>
        <p class="geo-tip">点击地图标记位置，拖动可微调，然后确认</p>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-plain" id="geo-cancel">取消</button>
          <button type="button" class="btn btn-primary-solid" id="geo-confirm">确认使用此位置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 弹窗：详情查看 ============ -->
  <div class="modal-backdrop" id="detail-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>美食详情</h2>
        <button class="modal-close" id="detail-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body detail-body" id="detail-body"></div>
      <div class="modal-footer" id="detail-footer">
        <button class="btn btn-danger" id="btn-detail-delete">删除</button>
        <div class="footer-right">
          <button class="btn btn-secondary" id="btn-detail-address">📍 地图定位</button>
          <button class="btn btn-primary-solid" id="btn-detail-edit">编辑</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 弹窗：分享 ============ -->
  <div class="modal-backdrop" id="share-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>分享美食地图</h2>
        <button class="modal-close" id="share-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="share-desc">其他人打开下面的链接，即可查看这份美食地图攻略（只读）：</p>
        <div class="share-url-wrap">
          <input type="text" id="share-url" readonly />
          <button class="btn btn-primary-solid" id="btn-copy-url">复制</button>
        </div>
        <p class="share-note">链接会带上<b>当前全部数据</b>。之后新增或修改内容，请重新点“分享”生成新链接。</p>
      </div>
    </div>
  </div>

  <!-- ============ 弹窗：数据管理 ============ -->
  <div class="modal-backdrop" id="manage-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>数据管理</h2>
        <button class="modal-close" id="manage-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body manage-body">
        <p class="manage-desc">当前共 <b id="manage-count">0</b> 条记录。你可以导出备份，或从备份文件恢复。</p>
        <div class="manage-actions">
          <button class="btn btn-secondary mg" id="btn-mg-export">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg> 导出备份 (.json)
          </button>
          <button class="btn btn-secondary mg" id="btn-mg-import">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> 从备份恢复
          </button>
          <button class="btn btn-danger mg" id="btn-mg-clear">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg> 清空所有数据
          </button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="file-import" accept=".json,application/json" hidden />

  <script src="app.js"></script>
</body>
</html>
